<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>BL Concordance - SPC Online</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#3498DB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SPC Online">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/landing_img.png?v=2">
  <link rel="apple-touch-icon" href="../assets/images/landing_img.png?v=2">

  <!-- Bootstrap core CSS -->
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom fonts for this template -->
  <link href="../assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href='https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800' rel='stylesheet' type='text/css'>

  <!-- Custom styles for this template -->
  <link href="../css/clean-blog.min.css" rel="stylesheet">
  
  <!-- PWA Styles -->
  <link href="../css/theme.css" rel="stylesheet">
  <link href="../css/dark-mode.css" rel="stylesheet">
  <link href="../css/modern-theme.css" rel="stylesheet">
  <!-- Universal Navbar Loader -->
  <script defer src="../js/navbar-loader.js"></script>
</head>

<body>

  <!-- PWA Controls -->
  <div class="pwa-controls" style="margin-top: 70px;"></div>

  <!-- Main Content -->
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-md-11 mx-auto">
        <style>
          .concordance-section {
            margin-bottom: 2.5rem;
          }
          .concordance-section h3 {
            color: #6B46C1;
            border-bottom: 2px solid #6B46C1;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
          }
          .concordance-section h3:hover {
            color: #764ba2;
          }
          .toggle-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
            color: #6B46C1;
          }
          .toggle-icon.collapsed {
            transform: rotate(-90deg);
          }
          .concordance-content {
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 1;
          }
          .concordance-content.collapsed {
            max-height: 0;
            opacity: 0;
          }
          .section-badge {
            font-size: 0.75rem;
            background: #e8dff5;
            color: #6B46C1;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: 500;
            margin-left: 0.5rem;
          }
          .search-box {
            margin-bottom: 2rem;
          }
          .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #dee2e6;
            border-radius: 4px;
            font-size: 1rem;
          }
          .search-box input:focus {
            outline: none;
            border-color: #6B46C1;
          }
          .search-result-item {
            padding: 1rem;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
          }
          .search-result-item:hover {
            border-color: #6B46C1;
            box-shadow: 0 2px 8px rgba(107,70,193,0.15);
          }
          .search-result-title {
            font-weight: 600;
            color: #6B46C1;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
          }
          .search-result-preview {
            color: #495057;
            font-size: 0.9rem;
            line-height: 1.5;
          }
          .search-highlight {
            background: #fff3cd;
            padding: 0.1rem 0.2rem;
            border-radius: 2px;
            font-weight: 500;
          }
          .search-result-meta {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
          }
          .concordance-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #eee;
          }
          .concordance-item:last-child {
            border-bottom: none;
          }
          .concordance-ref {
            font-weight: 600;
            color: #212529;
            cursor: pointer;
            transition: color 0.2s;
          }
          .concordance-ref:hover {
            color: #6B46C1;
            text-decoration: underline;
          }
          .concordance-context {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 0.25rem;
          }
          .concordance-sections {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
          }
          .section-tag {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
            font-size: 0.85rem;
          }
          .article-tag-clickable {
            cursor: pointer;
            transition: all 0.2s;
            background: #e8dff5;
            color: #6B46C1;
            font-weight: 500;
          }
          .article-tag-clickable:hover {
            background: #6B46C1;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(107,70,193,0.3);
          }
          .theme-item {
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 1rem;
          }
          .theme-title {
            font-weight: 600;
            color: #212529;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
          }
          .theme-description {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
          }
          .section-directory {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
          }
          .section-card {
            padding: 0.75rem;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
          }
          .section-number {
            font-weight: 700;
            color: #6B46C1;
            font-size: 1rem;
            margin-bottom: 0.25rem;
          }
          .section-title-card {
            font-weight: 600;
            color: #212529;
            margin-top: 0.5rem;
            display: none;
          }
          .section-part {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.25rem;
          }
          .no-results {
            text-align: center;
            padding: 2rem;
            color: #6c757d;
            font-style: italic;
          }
          .loading {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
          }
          @media (max-width: 768px) {
            .section-directory {
              grid-template-columns: 1fr;
            }
          }
          /* Article Modal Styles */
          .article-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
          }
          @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
          }
          .article-modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 700px;
            animation: slideDown 0.3s;
          }
          @keyframes slideDown {
            from {
              transform: translateY(-50px);
              opacity: 0;
            }
            to {
              transform: translateY(0);
              opacity: 1;
            }
          }
          .article-modal-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, #6B46C1 0%, #764ba2 100%);
            color: white;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
          }
          .article-modal-header h4 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
          }
          .article-modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: 300;
            cursor: pointer;
            padding: 0;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
          }
          .article-modal-close:hover {
            background: rgba(255,255,255,0.2);
          }
          .article-modal-body {
            padding: 2rem;
            line-height: 1.8;
            font-size: 1.05rem;
            color: #333;
            max-height: 400px;
            overflow-y: auto;
          }
          .article-modal-body p {
            margin: 0;
            text-align: justify;
          }
          .article-modal-footer {
            padding: 1rem 2rem;
            background: #f8f9fa;
            border-radius: 0 0 8px 8px;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
          }
          .btn-copy {
            background: #28a745;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
          }
          .btn-copy:hover {
            background: #218838;
          }
          .btn-copy.copied {
            background: #6B46C1;
          }
          .btn-close-modal {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s;
          }
          .btn-close-modal:hover {
            background: #5a6268;
          }
          .section-card {
            cursor: pointer;
            transition: all 0.2s;
          }
          .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107,70,193,0.2);
            border-color: #6B46C1;
          }
          @media (max-width: 768px) {
            .article-modal-content {
              width: 95%;
              margin: 10% auto;
            }
            .article-modal-body {
              padding: 1.5rem;
              font-size: 1rem;
            }
            .article-modal-footer {
              flex-direction: column;
            }
            .btn-copy, .btn-close-modal {
              width: 100%;
              justify-content: center;
            }
          }
        </style>

        <!-- Search Box -->
        <div class="search-box">
          <input type="text" id="concordanceSearch" placeholder="Search for keywords, scripture references, themes, or article numbers...">
          <div id="searchResultsInfo" style="margin-top: 0.5rem; font-size: 0.9rem; color: #6c757d;"></div>
        </div>
        
        <!-- Search Results Section -->
        <div id="searchResults" class="concordance-section" style="display:none;">
          <h3>🔍 Search Results</h3>
          <div id="searchResultsContent"></div>
        </div>
        
        <!-- Loading State -->
        <div id="loadingState" class="loading">
          <p>Loading concordance data...</p>
        </div>
        
        <!-- Scripture Index Section -->
        <div id="scriptureSection" class="concordance-section" style="display:none;">
          <h3 onclick="toggleSection('scripture')">
            <span>
              📖 Scripture Index
              <span class="section-badge" id="scriptureBadge">0</span>
            </span>
            <span class="toggle-icon collapsed" id="scriptureToggle">🔽</span>
          </h3>
          <div id="scriptureIndex" class="concordance-content collapsed"></div>
        </div>
        
        <!-- Themes & Keywords Section -->
        <div id="themesSection" class="concordance-section" style="display:none;">
          <h3 onclick="toggleSection('themes')">
            <span>
              🔍 Themes & Keywords
              <span class="section-badge" id="themesBadge">0</span>
            </span>
            <span class="toggle-icon collapsed" id="themesToggle">🔽</span>
          </h3>
          <div id="themesIndex" class="concordance-content collapsed"></div>
        </div>
        
        <!-- Article Directory -->
        <div id="directorySection" class="concordance-section" style="display:none;">
          <h3>📑 Article Directory (1-110)</h3>
          <div id="sectionDirectory" class="section-directory"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Article Text Modal -->
  <div id="articleModal" class="article-modal">
    <div class="article-modal-content">
      <div class="article-modal-header">
        <h4 id="modalArticleTitle"></h4>
        <button class="article-modal-close" onclick="closeArticleModal()">&times;</button>
      </div>
      <div class="article-modal-body">
        <p id="modalArticleText"></p>
      </div>
      <div class="article-modal-footer">
        <button class="btn-copy" onclick="copyArticleText()">
          <i class="fas fa-copy"></i> Copy Text
        </button>
        <button class="btn-close-modal" onclick="closeArticleModal()">Close</button>
      </div>
    </div>
  </div>

  <hr>

  <!-- Footer Loader -->
  <div id="footer-container"></div>

  <!-- Bootstrap core JavaScript -->
  <script src="../assets/vendor/jquery/jquery.min.js"></script>
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Custom scripts for this template -->
  <script src="../js/clean-blog.min.js"></script>

  <!-- PWA Features -->
  <script src="../js/app.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/bookmarks.js"></script>
  <script src="../js/font-size.js"></script>
  <script src="../js/prayer-tracker.js"></script>
  <script src="../js/footer-loader.js"></script>
  <script src="../js/bl-concordance.js"></script>

</body>

</html>
