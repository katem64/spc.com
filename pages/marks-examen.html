<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="M.A.R.K.S. Examen Guide for the Sisters of St. Paul of Chartres">
  <title>M.A.R.K.S. Examen | SPC Prayer.Com</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/spccomlogo.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/spccomlogo.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/spc-icon-180.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="../css/clean-blog.min.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/dark-mode.css?v=2">
  <link rel="stylesheet" href="../css/modern-theme.css">
  <link rel="stylesheet" href="../css/examen.css?v=10">
  <script defer src="../js/navbar-loader.js?v=4"></script>
</head>
<body class="examen-page">
  <div class="pwa-controls" aria-label="Prayer tools"></div>
  <main class="examen-shell">
    <section class="examen-hero">
      <img class="examen-cover" src="../assets/images/marks-examen-cover.png" alt="M.A.R.K.S. Examen Guide cover">
      <div>
        <p class="examen-eyebrow">SPC Prayer.Com</p>
        <h1>M.A.R.K.S. Examen</h1>
        <p id="examen-lead" class="examen-lead">A prayerful daily journey through the twelve Marks of our SPC identity.</p>
          <a id="start-examen-button" class="start-examen-button" href="#examen-content">Start today's Examen <i class="fas fa-arrow-right"></i></a>
        <div class="examen-language" role="group" aria-label="Language">
          <button type="button" class="language-button active" data-language="en">English</button>
          <button type="button" class="language-button" data-language="fr">Français</button>
        </div>
      </div>
    </section>

    <section class="examen-intro" aria-labelledby="intro-title">
      <h2 id="intro-title">Before you begin</h2>
      <p id="intro-text"></p>
      <div id="marks-steps" class="marks-steps"></div>
    </section>

    <section class="examen-search" aria-labelledby="search-title">
      <div class="section-heading-row">
          <h2 id="search-title">Find a reflection</h2>
        <span id="record-count" class="record-count"></span>
      </div>
        <input id="examen-search-input" class="form-control" type="search" placeholder="Search by Mark, week, day, or word" autocomplete="off">
      <div id="search-results" class="examen-search-results" aria-live="polite"></div>
    </section>
      <section class="examen-howto" aria-label="How to use the Examen">
        <div><span class="howto-number">1</span><strong id="howto-mark">Choose a Mark</strong><small id="howto-mark-help">One area of our SPC life</small></div>
        <div><span class="howto-number">2</span><strong id="howto-week">Choose a week</strong><small id="howto-week-help">Follow the four-week journey</small></div>
        <div><span class="howto-number">3</span><strong id="howto-day">Read today's prompt</strong><small id="howto-day-help">Pause, pray, and reflect</small></div>
      </section>

    <section id="examen-content" class="examen-content" aria-live="polite"></section>
  </main>

  <script src="../assets/vendor/jquery/jquery.min.js"></script>
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/clean-blog.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/font-size.js"></script>
  <script src="../js/bookmarks.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/ux-enhancements.js"></script>
  <script src="../js/footer-loader.js"></script>
  <script src="../js/examen.js?v=9"></script>
</body>
</html>
