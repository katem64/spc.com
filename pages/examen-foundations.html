<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="M.A.R.K.S. Examen Guide Foundations">
  <title>Examen Guide Foundations | SPC Prayer.Com</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/spccomlogo.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/spccomlogo.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/spc-icon-180.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="../css/clean-blog.min.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/dark-mode.css?v=2">
  <link rel="stylesheet" href="../css/modern-theme.css">
  <link rel="stylesheet" href="../css/examen.css?v=11">
  <script defer src="../js/navbar-loader.js?v=4"></script>
</head>
<body class="examen-page foundations-page">
  <main class="examen-shell foundations-shell">
    <a class="back-button" href="marks-examen.html"><i class="fas fa-arrow-left"></i> Back to M.A.R.K.S. Examen</a>
    <section class="examen-preliminaries foundations-content" aria-labelledby="foundations-title">
      <h1 id="foundations-title">Examen Guide Foundations</h1>
      <div class="preliminary-source" id="foundations-source">Loading the Examen Guide Foundations...</div>
    </section>
  </main>

  <script src="../assets/vendor/jquery/jquery.min.js"></script>
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/clean-blog.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/font-size.js"></script>
  <script src="../js/bookmarks.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/ux-enhancements.js"></script>
  <script src="../js/footer-loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const output = document.getElementById('foundations-source');
      try {
        const response = await fetch('../data/marks-examen-index.json?v=prelim1');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const escapeHtml = (value) => value.replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character]));
        const paragraphs = (data.preliminaries || 'The Examen Guide Foundations are unavailable.')
          .split(/\r?\n/)
          .map((paragraph) => paragraph.trim())
          .filter(Boolean);
        const french = localStorage.getItem('spc-examen-language') === 'fr';
        document.getElementById('foundations-title').textContent = french ? 'Fondements du guide de l’examen' : 'Examen Guide Foundations';
        output.innerHTML = paragraphs.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join('');
      } catch (error) {
        output.textContent = 'Unable to load the offline Examen Guide Foundations.';
        console.error('[Examen Foundations]', error);
      }
    });
  </script>
</body>
</html>
